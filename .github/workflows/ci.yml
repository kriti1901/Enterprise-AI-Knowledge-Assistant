name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: knowledge
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      # Offline settings: no API keys or model downloads needed in CI.
      EMBEDDING_BACKEND: hash
      LLM_PROVIDER: fake
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
      EVAL_DIR: ${{ github.workspace }}/eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://knowledge:ci-password@localhost:5432/knowledge
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t knowledge-api ./backend
      - name: Build frontend image
        run: docker build -t knowledge-frontend ./frontend
